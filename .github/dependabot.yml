# RabbitGram: automatic security/version update PRs.
# Minor and patch bumps are grouped into one PR per ecosystem to keep the noise
# down; security fixes still arrive immediately as their own PRs.
version: 2
updates:
  - package-ecosystem: npm # also handles pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'

# RabbitGram: nginx config for the production image. The Content-Security-Policy
# itself is baked into the built index.html as a <meta> tag (see
# securityHeaders.js / vite.config.ts); these are the headers a <meta> can't
# carry, mirroring server.js.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;

  add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "browsing-topics=(), interest-cohort=(), serial=(), usb=(), bluetooth=(), hid=(), midi=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Cache-Control "no-store" always;

  # Never serve dotfiles, source maps of other projects, or the dev-only
  # storage snapshot tool from a public deployment.
  location ~ /\. { deny all; }
  location = /snapshot.html { deny all; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
